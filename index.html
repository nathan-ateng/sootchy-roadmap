<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Sootchy Roadmap — Test v2</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --accent:#2383E2;--accent-hover:#1a6ec7;--accent-light:#EBF4FF;
  --canvas:#ffffff;--offset:#F7F6F3;
  --border:#E5E7EB;--border-strong:#D1D5DB;
  --text:#111827;--mid:#6B7280;--light:#9CA3AF;
  --font:'Inter','Segoe UI',system-ui,sans-serif;
  --th-q1:#2383E2;--th-q2:#7C3AED;--th-q3:#059669;--th-q4:#D97706;
  --th-inprogress:#F59E0B;--th-blocked:#EF4444;--th-done:#10B981;
  --th-bg:#F7F6F3;--th-surface:#ffffff;
  --th-pill-radius:6px;
  --blue:#2383E2;--green:#059669;--red:#EF4444;--amber:#D97706;--purple:#7C3AED;
}
body{font-family:var(--font);background:var(--canvas);color:var(--text);height:100vh;display:flex;flex-direction:column;overflow:hidden;-webkit-font-smoothing:antialiased;letter-spacing:-.01em}

.topbar{background:var(--canvas);border-bottom:1px solid var(--border);padding:0 16px;height:52px;display:flex;align-items:center;gap:8px;flex-shrink:0;position:relative;z-index:50}
.logo{font-size:15px;font-weight:800;color:var(--accent);letter-spacing:-.5px;white-space:nowrap;flex-shrink:0}
.rm-select{background:rgba(255,255,255,.15);border:1px solid rgba(255,255,255,.3);border-radius:5px;color:#fff;font-size:12px;padding:3px 8px;font-family:var(--font);cursor:pointer;width:130px;flex-shrink:0}
.rm-select option{background:#fff;color:var(--text)}
.topbar-r{margin-left:auto;display:flex;align-items:center;gap:5px;flex-shrink:0}
.btn{border:none;border-radius:6px;padding:5px 12px;font-size:12px;font-weight:500;cursor:pointer;font-family:var(--font);display:inline-flex;align-items:center;gap:5px;transition:all .15s;white-space:nowrap;height:32px}
.btn:hover{filter:brightness(.96)}
.btn-ghost{background:transparent;color:var(--mid);border:1px solid var(--border)}
.btn-sm{padding:4px 10px;font-size:11px;height:28px}
.btn-blue{background:var(--accent);color:#fff}
.btn-neutral{background:var(--offset);color:var(--text);border:1px solid var(--border)}
.btn-red{background:#FEF2F2;color:#EF4444;border:1px solid #FECACA}
.vt{display:flex;background:var(--offset);border-radius:6px;overflow:hidden;border:1px solid var(--border);height:32px}
.vt button{background:none;border:none;color:var(--mid);padding:0 12px;font-size:11px;font-weight:500;cursor:pointer;font-family:var(--font);height:100%}
.vt button.on{background:#fff;color:var(--text);font-weight:600;box-shadow:0 1px 3px rgba(0,0,0,.08)}

/* LAYOUT */
.layout{display:flex;flex:1;overflow:hidden;min-width:0}
.sidebar{width:268px;background:var(--canvas);border-right:1px solid var(--border);overflow-y:auto;flex-shrink:0;font-size:12px;transition:width .25s ease,opacity .2s ease;position:relative}
.sidebar.hidden{width:0!important;min-width:0!important;overflow:hidden;opacity:0;border-right:none!important;padding:0!important;flex-shrink:0}
.canvas-wrap{flex:1;overflow:auto;min-width:0;padding-left:24px;padding-right:16px}

/* SIDEBAR */
.sb-sec{border-bottom:1px solid var(--border);padding:12px 16px}
.sb-hd{display:flex;align-items:center;gap:6px;font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.7px;color:var(--light);margin-bottom:10px}
.collapse-btn{background:none;border:none;cursor:pointer;padding:1px 4px;color:var(--mid);font-size:10px;line-height:1;border-radius:3px;margin-left:auto;opacity:.7}
.collapse-btn:hover{opacity:1;background:#F0F2F5}
.fl{display:flex;flex-direction:column;gap:3px;margin-bottom:8px}
label{font-size:10px;font-weight:600;color:var(--mid)}
input[type=text],input[type=date],select,textarea{width:100%;border:1px solid var(--border);border-radius:4px;padding:3px 6px;font-size:11px;font-family:var(--font);color:var(--text);background:var(--th-surface)}
input[type=text]:focus,input[type=date]:focus,select:focus{outline:none;border-color:var(--blue)}
.lane-card{background:var(--offset);border:1px solid var(--border);border-radius:8px;margin-bottom:6px;overflow:hidden;transition:border-color .15s}.lane-card:hover{border-color:var(--border-strong)}
.lane-hd{display:flex;align-items:center;gap:4px;padding:5px 7px;background:#F0F2F5;border-bottom:1px solid var(--border)}
.lane-hd input{flex:1;background:none;border:none;font-weight:600;font-size:11px;color:var(--text);padding:0}
.lane-desc-inp{width:100%;border:none;border-bottom:1px solid var(--border);padding:3px 7px;font-size:10px;color:var(--mid);background:none;font-family:var(--font)}
.del{background:none;border:none;cursor:pointer;color:var(--mid);font-size:11px;padding:1px 3px;border-radius:3px;flex-shrink:0}
.del:hover{background:#FFEBEE;color:var(--red)}
.lane-items{padding:5px 7px}
.item-card{background:#fff;border:1px solid var(--border);border-radius:5px;margin-bottom:5px;overflow:hidden}
.item-card-top{display:flex;align-items:center;gap:4px;padding:5px 7px;border-bottom:1px solid var(--border)}
.item-card-top input{flex:1;border:none;font-weight:600;font-size:11px;color:var(--text);padding:0;font-family:var(--font)}
.add-item{display:flex;align-items:center;justify-content:center;padding:5px 8px;font-size:11px;color:var(--light);cursor:pointer;border:1px dashed var(--border);border-radius:6px;margin-top:4px;transition:all .15s;gap:4px}
.add-item:hover{background:var(--accent-light);color:var(--accent);border-color:var(--accent)}

/* TYPE COLOR SWATCH */
.type-swatch{width:14px;height:14px;border-radius:4px;cursor:pointer;flex-shrink:0;border:1px solid rgba(0,0,0,.08);transition:transform .1s}.type-swatch:hover{transform:scale(1.2)}
.type-row{display:flex;align-items:center;gap:8px;padding:4px 0;font-size:12px;color:var(--text)}

/* CANVAS */
.canvas{padding:16px 0;width:max-content;min-width:100%}
.c-hd{display:flex;flex-direction:column;margin-bottom:10px;padding-bottom:10px;border-bottom:1px solid var(--border)}
.c-title{font-size:22px;font-weight:700;color:var(--text);letter-spacing:-.3px}
.c-sub{font-size:12px;color:var(--light);margin-top:2px}
.c-meta{font-size:11px;color:var(--light);line-height:1.6;display:flex;gap:16px;margin-top:4px;flex-wrap:wrap}

/* Jira nav bar */
.jira-nav{display:flex;align-items:center;gap:0;border-bottom:1px solid var(--border);margin-bottom:14px;padding:0;background:var(--canvas)}
.jira-nav-item{display:flex;align-items:center;gap:5px;background:none;border:none;cursor:pointer;font-family:var(--font);font-size:12px;font-weight:500;color:var(--mid);padding:8px 14px;border-bottom:2px solid transparent;transition:color .15s;margin-bottom:-1px;white-space:nowrap}
.jira-nav-item:hover{color:var(--text)}
.jira-nav-item.active{color:var(--accent);border-bottom-color:var(--accent);font-weight:600}
.jira-nav-add{color:#1A7A4A!important;font-weight:600!important}
.jira-nav-add:hover{color:#15643C!important}

/* Legend footer */
.legend-footer{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:8px 12px;background:var(--canvas);border-top:1px solid var(--border);font-size:11px;color:var(--mid)}
.leg-title{font-weight:700;color:var(--mid);font-size:10px;text-transform:uppercase;letter-spacing:.5px}
.leg-group{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.leg-item{display:flex;align-items:center;gap:4px;cursor:pointer}
.leg-item:hover .leg-dot{transform:scale(1.3)}
.leg-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;transition:transform .15s}
.leg-sep{width:1px;height:14px;background:var(--border)}

/* GRID WRAPPERS FOR HORIZONTAL SCROLL */
.grid-wrap{overflow-x:auto;overflow-y:visible;width:100%}
.grid{display:grid;border-top:1px solid var(--border);border-left:1px solid var(--border);width:max-content;min-width:100%}
.qh-spacer{background:#FAFBFC;border-bottom:1px solid var(--border);border-right:1px solid var(--border);min-height:34px}
.qh-cell{color:#fff;font-size:11px;font-weight:600;padding:6px 8px;text-align:center;border-bottom:1px solid var(--border);border-right:1px solid var(--border);display:flex;align-items:center;justify-content:center;letter-spacing:.2px;flex-shrink:0}
.ll-cell{background:#FAFBFC;border-bottom:1px solid var(--border);border-right:1px solid var(--border);padding:8px;display:flex;flex-direction:row;align-items:flex-start;gap:6px;flex-shrink:0}
.ll-name{font-weight:700;font-size:11px}
.ll-desc{font-size:10px;color:var(--mid)}
.dc-cell{border-bottom:1px solid var(--border);border-right:1px solid var(--border);padding:4px;position:relative;overflow-x:visible;overflow-y:hidden;vertical-align:top;flex-shrink:0}
.re{background:#fff}
.ro{background:#F6F8FB}

/* PILLS & MULTI-TYPE CAPS */
.pill-wrap{display:inline-flex;flex-direction:column;gap:0;margin-bottom:2px;position:relative;z-index:3;cursor:grab;touch-action:none}
.pill-wrap:active{cursor:grabbing}
.pill{border-radius:var(--th-pill-radius);padding:3px 7px;font-size:11px;font-weight:600;display:flex;align-items:center;gap:4px;white-space:nowrap;overflow:hidden;min-height:26px;max-width:100%;position:relative}
.pill-caps{display:flex;align-items:center;position:absolute;left:0;top:0;bottom:0;z-index:2}
.pill-cap{height:100%;width:14px;border-right:1.5px solid rgba(255,255,255,0.4);flex-shrink:0}
.pill-cap:first-child{border-top-left-radius:var(--th-pill-radius);border-bottom-left-radius:var(--th-pill-radius)}
.pill-label{overflow:hidden;text-overflow:ellipsis;flex:1;min-width:0;max-width:100%}
.pill-dates{font-size:9px;color:var(--mid);padding-left:2px;white-space:nowrap;margin-top:2px;display:block;overflow:hidden;text-overflow:ellipsis;max-width:100%;line-height:14px;height:14px}
.s-dot{width:6px;height:6px;border-radius:50%;flex-shrink:0}

/* TODAY LINE */
.today-line{position:absolute;top:0;bottom:0;width:2px;background:var(--red);z-index:1;pointer-events:none}
.today-line::before{content:attr(data-l);position:absolute;top:-16px;left:50%;transform:translateX(-50%);font-size:9px;font-weight:700;color:var(--red);white-space:nowrap}

/* TOOLTIP */
#tt{position:fixed;background:#1A1A1A;color:#fff;border-radius:7px;padding:9px 12px;font-size:12px;max-width:230px;pointer-events:none;z-index:999;display:none;box-shadow:0 4px 20px rgba(0,0,0,.3)}
#tt.show{display:block}

/* CONTEXT MENU FOR Z-INDEX ORDERING */
.ctx-menu{position:fixed;background:#ffffff;border:1px solid var(--border);border-radius:8px;box-shadow:0 10px 30px rgba(0,0,0,0.18);padding:4px 0;z-index:10000;display:none;min-width:160px;font-size:12px;font-family:var(--font)}
.ctx-menu-item{padding:8px 14px;cursor:pointer;display:flex;align-items:center;gap:8px;color:var(--text);transition:background 0.12s}
.ctx-menu-item:hover{background:var(--offset);color:var(--accent)}

/* DETAIL PANEL */
.detail-panel-wrap{background:var(--canvas);border-top:1px solid var(--border);padding:0}
.detail-panel{padding:16px 18px}
.detail-panel-hd{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:14px;gap:12px}
.detail-panel-hd h3{font-size:16px;font-weight:700;flex:1}
.detail-panel-actions{display:flex;gap:7px;align-items:center;flex-shrink:0}
.detail-grid{display:grid;grid-template-columns:1fr 1fr;gap:8px 24px;margin-bottom:16px}
.detail-field{display:flex;flex-direction:column;gap:3px}
.detail-field-lbl{font-size:10px;font-weight:700;text-transform:uppercase;letter-spacing:.5px;color:var(--light)}
.detail-field-val{font-size:13px;color:var(--text)}
.detail-field-input{width:100%;border:1px solid var(--border);border-radius:5px;padding:6px 8px;font-size:12px;font-family:var(--font);color:var(--text);background:#FAFBFC}
.detail-field-input:focus{outline:none;border-color:var(--blue);background:#fff}

/* TOAST */
#toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(10px);background:#1A1A1A;color:#fff;padding:7px 16px;border-radius:20px;font-size:12px;font-weight:600;opacity:0;transition:all .25s;z-index:1000;pointer-events:none}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}

.sb-toggle-topbar{background:none;border:1px solid var(--border);border-radius:6px;padding:5px 9px;color:var(--mid);font-size:14px;cursor:pointer;flex-shrink:0;line-height:1;transition:all .15s;display:flex;align-items:center;justify-content:center;width:32px;height:32px}
.auth-overlay{position:fixed;inset:0;background:#F0F2F5;display:flex;align-items:center;justify-content:center;z-index:9999}
.auth-card{background:#fff;border:1px solid #DDE2EA;border-radius:16px;padding:40px 44px;width:360px;display:flex;flex-direction:column;align-items:center;gap:18px;box-shadow:0 4px 24px rgba(0,0,0,.08)}
.auth-logo{font-size:26px;font-weight:800;color:#1A7A4A;letter-spacing:-.5px}
.auth-google-btn{width:100%;display:flex;align-items:center;justify-content:center;gap:10px;padding:11px 20px;background:#fff;border:1px solid #DDE2EA;border-radius:8px;font-size:13px;font-weight:600;cursor:pointer;font-family:var(--font);color:#1A1A1A;transition:box-shadow .15s}
.user-badge{display:flex;align-items:center;gap:6px;padding:4px 10px;background:var(--offset);border-radius:20px;border:1px solid var(--border)}
.user-av{width:22px;height:22px;border-radius:50%;display:flex;align-items:center;justify-content:center;font-size:9px;font-weight:700;color:#fff;flex-shrink:0}
.user-nm{font-size:12px;font-weight:600;color:var(--text)}

.ll-cell.drag-target{border-left:3px solid #1A7A4A!important;background:#E8F5EE!important}
</style>
</head>
<body>

<!-- AUTH OVERLAY -->
<div class="auth-overlay" id="auth-overlay">
  <div class="auth-card">
    <div class="auth-logo">Sootchy</div>
    <div style="font-size:16px;font-weight:700;color:#1A1A1A;text-align:center;margin-top:-6px">Roadmap Editor</div>
    <div style="font-size:12px;color:#555;text-align:center;line-height:1.6;margin-top:-10px">Sign in with your @sootchy.com Google account to continue.</div>
    <div class="auth-err" id="auth-err" style="display:none;padding:8px;background:#FFF5F5;border:1px solid #FFCDD2;color:#C62828;border-radius:6px;font-size:12px"></div>
    <div class="auth-msg" id="auth-msg" style="display:none;font-size:12px;color:#555">Signing you in...</div>
    <button class="auth-google-btn" id="auth-btn" onclick="authSignIn()">
      <svg width="18" height="18" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.08 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.18 1.48-4.97 2.31-8.16 2.31-6.26 0-11.57-3.59-13.46-8.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>
      Sign in with Google
    </button>
  </div>
</div>

<!-- HUB PAGE -->
<div id="hub-page" style="display:none;flex:1;flex-direction:column;align-items:center;justify-content:center;background:var(--canvas)">
  <div style="text-align:center;margin-bottom:48px">
    <div style="font-size:36px;font-weight:800;color:#1A7A4A;letter-spacing:-.8px;margin-bottom:8px">Sootchy</div>
    <div style="font-size:16px;color:var(--mid);font-weight:400">Roadmap Generator</div>
  </div>
  <div style="display:flex;gap:16px;width:100%;max-width:680px;padding:0 24px">
    <button onclick="showNewModal()" style="flex:1;padding:28px 24px;background:#1A7A4A;color:#fff;border:none;border-radius:12px;cursor:pointer;font-family:var(--font);display:flex;flex-direction:column;align-items:flex-start;gap:12px;text-align:left;min-height:180px">
      <div style="width:40px;height:40px;background:rgba(255,255,255,.2);border-radius:8px;display:flex;align-items:center;justify-content:center">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
      </div>
      <div>
        <div style="font-size:16px;font-weight:700;margin-bottom:5px">New Roadmap</div>
        <div style="font-size:13px;opacity:.75;line-height:1.5">Start a fresh roadmap from scratch.</div>
      </div>
    </button>
    <button onclick="showExistingModal()" style="flex:1;padding:28px 24px;background:#fff;color:var(--text);border:2px solid var(--border);border-radius:12px;cursor:pointer;font-family:var(--font);display:flex;flex-direction:column;align-items:flex-start;gap:12px;text-align:left;min-height:180px">
      <div style="width:40px;height:40px;background:#E8F5EE;border-radius:8px;display:flex;align-items:center;justify-content:center">
        <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="#1A7A4A" stroke-width="2"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
      </div>
      <div>
        <div style="font-size:16px;font-weight:700;margin-bottom:5px">Existing Roadmaps</div>
        <div style="font-size:13px;color:var(--mid);line-height:1.5">Open and continue saved roadmaps.</div>
      </div>
    </button>
  </div>
</div>

<!-- WORKSPACE BAR -->
<div id="workspace-bar" style="display:none;background:var(--canvas);border-bottom:1px solid var(--border);padding:0 16px;height:52px;flex-shrink:0;align-items:center;gap:8px;z-index:50">
  <button onclick="goToHub()" style="display:flex;align-items:center;gap:5px;background:none;border:none;cursor:pointer;color:var(--mid);font-size:12px;font-weight:500;font-family:var(--font);padding:5px 8px;border-radius:6px">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="15 18 9 12 15 6"/></svg>
    Roadmaps
  </button>
  <div style="width:1px;height:20px;background:var(--border)"></div>
  <button class="sb-toggle-topbar" onclick="toggleSidebar()" id="sb-toggle" title="Toggle sidebar">
    <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><line x1="3" y1="6" x2="21" y2="6"/><line x1="3" y1="12" x2="21" y2="12"/><line x1="3" y1="18" x2="21" y2="18"/></svg>
  </button>
  <select class="rm-select" id="rm-sel" onchange="switchRoadmap(this.value)"></select>

  <div style="margin-left:auto;display:flex;align-items:center;gap:8px">
    <div class="vt">
      <button id="vt-q" class="on" onclick="setView('q')">Quarterly</button>
      <button id="vt-m" onclick="setView('m')">Monthly</button>
    </div>
    <div id="user-badge-wrap" style="display:none">
      <div class="user-badge">
        <div class="user-av" id="user-av"></div>
        <span class="user-nm" id="user-nm"></span>
      </div>
    </div>
    <button id="signout-btn" style="display:none;background:none;border:1px solid var(--border);border-radius:6px;padding:4px 10px;font-size:11px;font-weight:600;cursor:pointer;font-family:var(--font);color:var(--mid)" onclick="authSignOut()">Sign out</button>
  </div>
</div>

<div class="layout" id="workspace-layout">
  <div class="sidebar" id="sidebar"></div>
  <div class="canvas-wrap">
    <div id="canvas"></div>
    <div id="detail-area"></div>
  </div>
</div>

<div id="tt"></div>
<div id="toast"></div>
<div id="mc"></div>

<!-- CONTEXT MENU FOR ORDERING / Z-INDEX -->
<div id="ctx-menu" class="ctx-menu">
  <div style="padding: 4px 12px; font-size: 10px; font-weight: 700; color: var(--light); text-transform: uppercase;">Stack Order</div>
  <div class="ctx-menu-item" onclick="execCtxOrder('front')">
    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="17 11 12 6 7 11"/><line x1="12" y1="18" x2="12" y2="6"/><line x1="4" y1="4" x2="20" y2="4"/></svg>
    Bring to Front
  </div>
  <div class="ctx-menu-item" onclick="execCtxOrder('forward')">
    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="18 15 12 9 6 15"/></svg>
    Bring Forward
  </div>
  <div class="ctx-menu-item" onclick="execCtxOrder('backward')">
    <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><polyline points="6 9 12 15 18 9"/></svg>
    Send Backward
  </div>

<script>
let TYPES=[
  {id:'design',label:'Product Design',color:'#1A1A1A',tc:'#fff'},
  {id:'dev',label:'Development',color:'#1A7A4A',tc:'#fff'},
  {id:'considering',label:'Being Considered',color:'#E0E0E0',tc:'#333'},
  {id:'biz',label:'Business / GTM',color:'#558B2F',tc:'#fff'},
  {id:'thirdparty',label:'3rd Party Integration',color:'#1B4F8A',tc:'#fff'},

  {id:'blocked',label:'Blocked',color:'#C62828',tc:'#fff'},

let TM=()=>Object.fromEntries(TYPES.map(t=>[t.id,t]));

let STATUS_COLORS={inprogress:'#F59E0B',blocked:'#C62828',done:'#1A7A4A'};
function getStatusDot(id){
  if(id==='inprogress')return STATUS_COLORS.inprogress;
  if(id==='blocked')return STATUS_COLORS.blocked;
  if(id==='done')return STATUS_COLORS.done;

const STATUSES=[{id:'',label:'No Status'},{id:'inprogress',label:'In Progress'},{id:'blocked',label:'Blocked'},{id:'done',label:'Done'}];
const MONTHS=['Jan','Feb','Mar','Apr','May','Jun','Jul','Aug','Sep','Oct','Nov','Dec'];
const QC=['var(--th-q1)','var(--th-q1)','var(--th-q1)','var(--th-q2)','var(--th-q2)','var(--th-q2)','var(--th-q3)','var(--th-q3)','var(--th-q3)','var(--th-q4)','var(--th-q4)','var(--th-q4)'];
const AVCOLS=['#1B4F8A','#1A7A4A','#B45309','#6A1B9A','#C62828','#0F6E56'];

function avatarColor(n){let h=0;for(let ch of(n||''))h=(h*31+ch.charCodeAt(0))%AVCOLS.length;return AVCOLS[h];}
function initials(n){if(!n)return'?';const p=n.trim().split(/\s+/);return p.length>=2?(p[0][0]+p[p.length-1][0]).toUpperCase():n.slice(0,2).toUpperCase();}
function parseAssignees(v){if(!v)return[];if(Array.isArray(v))return v.filter(Boolean);return v.split(',').map(s=>s.trim()).filter(Boolean);}
function esc(s){const d=document.createElement('div');d.textContent=s||'';return d.innerHTML;}
function genId(){return 'rm_'+Date.now()+'_'+Math.random().toString(36).slice(2,6);}
function fmtDate(d){return d.toLocaleDateString('en-US',{year:'numeric',month:'short',day:'numeric'});}
function isoToDisp(s){if(!s)return'';try{const d=new Date(s+'T00:00:00');return d.toLocaleDateString('en-US',{month:'short',day:'numeric'});}catch{return s;}}
function dateToYMD(s){if(!s)return null;const d=new Date(s+'T00:00:00');if(isNaN(d))return null;return{y:d.getFullYear(),m:d.getMonth(),d:d.getDate(),ts:d.getTime()};}

function dateToQOffset(s){
  const ymd=dateToYMD(s);if(!ymd)return 0;
  const qStartMonth=Math.floor(ymd.m/3)*3;
  const daysIntoQ=(ymd.m-qStartMonth)*30+(ymd.d-1);
  return daysIntoQ/91;
}
function buildDefaultMonths(){const yr=new Date().getFullYear();return Array.from({length:12},(_,i)=>({label:MONTHS[i]+' '+yr,color:QC[i],year:yr,month:i}));}

let state={roadmaps:{},activeId:null,view:'q',selectedPill:null};
var _itemDrafts={};
var _collapsed={};

function defRm(name){
  return {name,meta:{subtitle:'',version:fmtDate(new Date()),author:'Nathan Ateng',approved:'TBD',footnote:'Timelines are rough targets.'},
    quarters:[{label:'Q1 · 2026',color:'var(--th-q1)'},{label:'Q2 · 2026',color:'var(--th-q2)'},{label:'Q3 · 2026',color:'var(--th-q3)'},{label:'Q4 · 2026',color:'var(--th-q4)'}],

}

  name:'SLX',meta:{subtitle:'Financial literacy platform',version:'Jun 11, 2026',author:'Nathan Ateng',approved:'TBD',footnote:'Timelines are rough targets.'},

      {label:'Module Architecture',type:'dev',types:['dev'],status:'done',startDate:'2026-02-01',endDate:'2026-03-31',assignee:'Saeed',blockers:[],col:0,span:2,zIndex:3},

function _toggleSection(key){_collapsed[key]=!_collapsed[key];renderSidebar();}

function _draftKey(li,pi){return li+'-'+pi;}
function _getDraft(li,pi){
  const key=_draftKey(li,pi);
  if(!_itemDrafts[key]){
    const rm=state.roadmaps[state.activeId];
    if(rm?.lanes?.[li]?.pills?.[pi])

}
function _setDraftField(li,pi,field,val){const d=_getDraft(li,pi);if(d)d[field]=val;}

function _toggleDraftType(li,pi,typeId){
  const d=_getDraft(li,pi);if(!d)return;
  if(!Array.isArray(d.types))d.types=[d.type||'dev'];

    d.types.push(typeId);

  d.type=d.types[0];

}

function _saveItem(li,pi){

}

function save(){

}

function getCols(){

function toast(msg,color){

  t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2200);
}

/* POINTER DRAG */
let _pd=null;
function _pdDaysPerPx(){return state.view==='m'?30.44/120:91/200;}

function _pdStartDrag(e,li,pi){
  if(e.button!==0)return;
  const rm=state.roadmaps[state.activeId];if(!rm)return;
  const lane=rm.lanes?.[li];if(!lane)return;
  const pill=lane.pills?.[pi];if(!pill)return;

  e.preventDefault();
  e.stopPropagation();

  const startMs=pill.startDate?new Date(pill.startDate+'T00:00:00').getTime():Date.now();
  const endMs=pill.endDate?new Date(pill.endDate+'T00:00:00').getTime():null;
  const durMs=(startMs&&endMs)?endMs-startMs:0;

  const scrollEl=document.querySelector('.grid-wrap');
  const startScrollLeft=scrollEl?scrollEl.scrollLeft:0;

  _pd={
    li,pi,origLi:li,origPill:{...pill},
    startX:e.clientX,startY:e.clientY,
    startScrollLeft,startMs,endMs,durMs,
    currentLi:li,daysPerPx:_pdDaysPerPx(),active:false,el:e.currentTarget
  };

  document.addEventListener('pointermove',_pdMove,{passive:false});
  document.addEventListener('pointerup',_pdEnd);
}

function _pdMove(e){
  if(!_pd)return;
  const scrollEl=document.querySelector('.grid-wrap');
  const scrollDelta=scrollEl?scrollEl.scrollLeft-_pd.startScrollLeft:0;
  const dx=(e.clientX-_pd.startX)+scrollDelta;
  const dy=e.clientY-_pd.startY;

  if(!_pd.active&&Math.abs(dx)<4&&Math.abs(dy)<4)return;
  _pd.active=true;
  e.preventDefault();

  if(_pd.el){
    _pd.el.style.opacity='0.85';
    _pd.el.style.transform=`translateX(${dx}px)`;
    _pd.el.style.zIndex='100';
  }

  const daysDelta=Math.round(dx*_pd.daysPerPx);
  const newStartMs=_pd.startMs+daysDelta*86400000;
  _pd.previewStartMs=newStartMs;
}

function _pdEnd(e){
  if(!_pd)return;
  document.removeEventListener('pointermove',_pdMove);
  document.removeEventListener('pointerup',_pdEnd);

  if(!_pd.active){
    if(_pd.el)_pd.el.style.opacity='';
    _pd=null;return;
  }

  if(_pd.el)_pd.el.style.opacity='';

  const{origLi,pi,previewStartMs,durMs}=_pd;
  _pd=null;

  const rm=state.roadmaps[state.activeId];if(!rm)return;
  const pill=rm.lanes[origLi]?.pills?.[pi];if(!pill)return;

  if(previewStartMs){
    pill.startDate=new Date(previewStartMs).toISOString().slice(0,10);
    if(durMs>0)pill.endDate=new Date(previewStartMs+durMs).toISOString().slice(0,10);
  }

  save();
  renderSidebar();renderCanvas();
  toast('Dates updated','#1A7A4A');
}

/* CONTEXT MENU FOR Z-INDEX ORDERING */
let _ctxTarget=null;
function showPillContextMenu(e,li,pi){
  e.preventDefault();
  e.stopPropagation();
  _ctxTarget={li,pi};
  const menu=document.getElementById('ctx-menu');
  if(!menu)return;
  let x=e.clientX,y=e.clientY;
  if(x+170>window.innerWidth)x=window.innerWidth-180;
  if(y+180>window.innerHeight)y=window.innerHeight-190;
  menu.style.left=x+'px';
  menu.style.top=y+'px';
  menu.style.display='block';
}

function hideContextMenu(){
  const menu=document.getElementById('ctx-menu');
  if(menu)menu.style.display='none';
}

document.addEventListener('click',hideContextMenu);

function execCtxOrder(action){
  hideContextMenu();
  if(!_ctxTarget)return;
  const {li,pi}=_ctxTarget;
  const rm=state.roadmaps[state.activeId];if(!rm)return;
  const pill=rm.lanes?.[li]?.pills?.[pi];if(!pill)return;

  let lanePills=rm.lanes[li].pills||[];
  let maxZ=lanePills.reduce((max, item)=>Math.max(max, item.zIndex||3),3);

  if(action==='front') pill.zIndex=maxZ+2;
  else if(action==='forward') pill.zIndex=(pill.zIndex||3)+1;
  else if(action==='backward') pill.zIndex=Math.max(1,(pill.zIndex||3)-1);
  else if(action==='back') pill.zIndex=1;

  save();
  renderCanvas();
  toast(`Layer order: ${action}`);
}

function renderSelect(){
  const sel=document.getElementById('rm-sel');sel.innerHTML='';
  Object.entries(state.roadmaps).forEach(([id,rm])=>{

function switchRoadmap(id){

function setView(v){

function renderSidebar(){

  const cols=getCols();

    </div>`;
  (rm.lanes||[]).forEach((lane,li)=>{
    h+=`<div class="lane-card">
      <div class="lane-hd">
        <input value="${esc(lane.name)}" onchange="state.roadmaps[state.activeId].lanes[${li}].name=this.value;renderCanvas();save()" placeholder="Lane name">
        <button class="del" onclick="delLane(${li})">✕</button>
      </div>
      <div class="lane-items">`;
    (lane.pills||[]).forEach((p,pi)=>{
      h+=`<div class="item-card">
        <div class="item-card-top">
          <input value="${esc(p.label)}" onchange="_setDraftField(${li},${pi},'label',this.value);_saveItem(${li},${pi})" placeholder="Item name">
          <button class="del" onclick="delPill(${li},${pi})">✕</button>
        </div>
      </div>`;
    });
    h+=`<div class="add-item" onclick="openAddItemDialog(${li})">+ Add item</div>

  });

  // Timeframe Section
  h+=`<div class="sb-sec"><div class="sb-hd"><span>Timeframe Columns</span><button class="btn btn-neutral btn-sm" style="margin-left:auto" onclick="addCol()">+ Add</button></div>`;
  cols.forEach((col,i)=>{
    h+=`<div style="display:flex;align-items:center;gap:4px;margin-bottom:4px">
      <input type="text" value="${esc(col.label)}" oninput="getCols()[${i}].label=this.value;renderCanvas();save()" style="flex:1">
      <button class="del" onclick="getCols().splice(${i},1);renderSidebar();renderCanvas();save()">✕</button>
    </div>`;
  });
  h+=`</div>`;

  document.getElementById('sidebar').innerHTML=h;
}

function assignRows(items){
  if(!items||!items.length)return items;
  const sorted=[...items].sort((a,b)=>a.startMs-b.startMs);
  const rowSlots=[];
  sorted.forEach(item=>{
    const sc=item.si!==undefined?item.si:(item.col||0);
    const ec=item.ei!==undefined?item.ei:(item.endColF!==undefined?Math.floor(item.endColF):sc);
    let placed=false;
    for(let r=0;r<rowSlots.length;r++){
      const conflicts=rowSlots[r].some(slot=>{
        return (item.startMs<slot.endMs&&item.endMs>slot.startMs) && (sc<=slot.ec&&ec>=slot.sc);
      });
      if(!conflicts){
        item.row=r;
        rowSlots[r].push({startMs:item.startMs,endMs:item.endMs,sc,ec});
        placed=true;break;
      }
    }
    if(!placed){
      item.row=rowSlots.length;
      rowSlots.push([{startMs:item.startMs,endMs:item.endMs,sc,ec}]);
    }
  });
  return items;
}

/* RENDER PILL WITH MULTI-TYPE CAPS & Z-INDEX */
function pillHTML(p,maxW,li,pi,offsetPct,widthPct,preciseStyleArg){
  const usePrecise=offsetPct!==undefined&&widthPct!==undefined;
  
  // Handle Multiple Stacked Types (Multi-Caps)
  const typesList=Array.isArray(p.types)&&p.types.length>0?p.types:[p.type||'dev'];
  const primaryType=TM()[typesList[0]]||{color:'#1A7A4A',tc:'#fff'};
  const isDone=p.status==='done';
  const doneStyle=isDone?';opacity:0.5;filter:grayscale(35%)':'';
  const isSelected=state.selectedPill?.li===li&&state.selectedPill?.pi===pi;
  const outline=isSelected?`;box-shadow:0 0 0 2.5px #fff,0 0 0 4px ${primaryType.color}`:'';
  
  const zIdx=p.zIndex||3;

  let capsHTML='';
  if(typesList.length>1){
    capsHTML=`<div class="pill-caps">`;
    typesList.forEach((tId)=>{
      const tInfo=TM()[tId]||{color:'#888'};
      capsHTML+=`<div class="pill-cap" style="background:${tInfo.color}" title="${esc(tInfo.label)}"></div>`;
    });
    capsHTML+=`</div>`;
  }

  const leftPadding=typesList.length>1?(typesList.length*14+6)+'px':'7px';
  const bgStyle=typesList.length>1?`background:${TM()[typesList[typesList.length-1]]?.color||primaryType.color}`:`background:${primaryType.color}`;

  const dateStr=(p.startDate||p.endDate)?`${isoToDisp(p.startDate)}${p.endDate?` → ${isoToDisp(p.endDate)}`:''}`:null;

  let preciseStyle=preciseStyleArg||null;
  if(!preciseStyle&&usePrecise){
    preciseStyle=`position:absolute;left:${offsetPct.toFixed(1)}%;width:${Math.max(widthPct,2).toFixed(1)}%;top:5px;z-index:${zIdx}`;
  } else if(preciseStyleArg){
    // Inject custom zIndex
    preciseStyle=preciseStyleArg.replace(/z-index:\d+/,`z-index:${zIdx}`);
  }

  const wrapStyle=preciseStyle||`width:${maxW}px;max-width:${maxW}px;z-index:${zIdx}`;

  return `<div class="pill-wrap" style="${wrapStyle}${doneStyle}"
      onclick="selectPill(${li},${pi})"
      oncontextmenu="showPillContextMenu(event,${li},${pi})"
      onpointerdown="_pdStartDrag(event,${li},${pi})">
    <div class="pill" style="${bgStyle};color:${primaryType.tc};padding-left:${leftPadding};width:100%;pointer-events:none${outline}">
      ${capsHTML}
      <span class="pill-label">${esc(p.label)}</span>
      ${p.status?`<span class="s-dot" style="background:${getStatusDot(p.status)}"></span>`:''}
    </div>
    ${dateStr?`<div class="pill-dates" style="pointer-events:none">${esc(dateStr)}</div>`:''}
  </div>`;
}

function renderCanvas(){
  const rm=state.roadmaps[state.activeId];
  if(!rm){document.getElementById('canvas').innerHTML='<div style="padding:40px;color:#888">Select or create a roadmap.</div>';return;}
  if(state.view==='q')renderQuarterly(rm);
  else renderMonthly(rm);
}

/* QUARTERLY VIEW — FIXED HORIZONTAL SCROLLING GRID */
function renderQuarterly(rm){
  const cols=rm.quarters;const nc=cols.length;
  const CW=200,LW=160;
  const totalW=LW+CW*nc; // Strict explicit total width

  let h=`<div class="c-hd"><div class="c-title">${esc(rm.name)}</div></div>`;
  h+=`<div class="jira-nav"><button onclick="addLane()" class="jira-nav-item jira-nav-add">+ Add Swim Lane</button></div>`;

  h+=`<div class="grid-wrap">
    <div style="position:relative;width:${totalW}px;min-width:${totalW}px">
      <div class="grid" style="grid-template-columns:${LW}px repeat(${nc},${CW}px);width:${totalW}px;min-width:${totalW}px">
        <div class="qh-spacer"></div>`;
  cols.forEach(col=>h+=`<div class="qh-cell" style="background:${col.color}">${esc(col.label)}</div>`);

  (rm.lanes||[]).forEach((lane,li)=>{
    const allPills=(lane.pills||[]).map((p,pi)=>{
      let col=p.col||0;
      let startOff=0,endColF=col+(p.span||1);
      if(p.startDate){
        const ymd=dateToYMD(p.startDate);
        if(ymd){
          const qNum=Math.floor(ymd.m/3);
          col=Math.min(qNum,nc-1);
          startOff=dateToQOffset(p.startDate);
        }
      }
      if(p.endDate){
        const ymd=dateToYMD(p.endDate);
        if(ymd){
          const qNum=Math.floor(ymd.m/3);
          endColF=qNum+dateToQOffset(p.endDate);
        }
      }
      col=Math.min(Math.max(col,0),nc-1);
      const startMs=p.startDate?new Date(p.startDate+'T00:00:00').getTime():col*7776000000;
      const endMs=p.endDate?new Date(p.endDate+'T00:00:00').getTime():startMs+7776000000;
      return{p,pi,col,startOff,endColF,startMs,endMs,si:col,ei:Math.min(Math.floor(endColF),nc-1)};
    });

    assignRows(allPills);
    const byCol={};
    allPills.forEach(item=>{if(!byCol[item.col])byCol[item.col]=[];byCol[item.col].push(item);});
    const maxRow=allPills.reduce((m,x)=>Math.max(m,(x.row||0)),0);
    const rowH=56;const cellH=Math.max(64,(maxRow+1)*rowH+8);
    const par=li%2===0?'re':'ro';

    h+=`<div class="ll-cell ${par}" data-li="${li}" style="min-height:${cellH}px">
      <div style="display:flex;flex-direction:column;flex:1;min-width:0">
        <span class="ll-name">${esc(lane.name)}</span>
      </div>
      <button onclick="openAddItemDialog(${li})" style="border:none;background:none;cursor:pointer;color:var(--mid)">+</button>
    </div>`;

    for(let ci=0;ci<nc;ci++){
      const cellPills=byCol[ci]||[];
      h+=`<div class="dc-cell ${par}" style="min-height:${cellH}px;height:${cellH}px" data-li="${li}" data-col="${ci}">`;
      cellPills.forEach(({p,pi,startOff,endColF,row})=>{
        const r=row||0;
        const widthUnits=Math.max(0.1,endColF-ci-startOff);
        const leftPct=startOff*100;
        const widthPct=widthUnits*100;
        const top=4+r*rowH;
        const preciseStyle=`position:absolute;left:${leftPct.toFixed(1)}%;width:${widthPct.toFixed(1)}%;top:${top}px;z-index:${p.zIndex||(3+r)}`;
        h+=pillHTML(p,CW*Math.max(1,widthUnits)-8,li,pi,undefined,undefined,preciseStyle);
      });
      h+=`</div>`;
    }
  });

  h+=`</div></div></div>`;
  document.getElementById('canvas').innerHTML=h;
}

/* MONTHLY VIEW — FIXED HORIZONTAL SCROLLING GRID */
function renderMonthly(rm){
  const cols=rm.months;const nc=cols.length;
  const CW=120,LW=165;
  const totalW=LW+CW*nc; // Strict explicit total width

  let h=`<div class="c-hd"><div class="c-title">${esc(rm.name)}</div></div>`;
  h+=`<div class="jira-nav"><button onclick="addLane()" class="jira-nav-item jira-nav-add">+ Add Swim Lane</button></div>`;

  h+=`<div class="grid-wrap">
    <div style="position:relative;width:${totalW}px;min-width:${totalW}px">
      <div class="grid" style="grid-template-columns:${LW}px repeat(${nc},${CW}px);width:${totalW}px;min-width:${totalW}px">
        <div class="qh-spacer"></div>`;
  cols.forEach(c=>h+=`<div class="qh-cell" style="background:${c.color}">${esc(c.label)}</div>`);

  (rm.lanes||[]).forEach((lane,li)=>{
    const par=li%2===0?'re':'ro';
    const allPillsM=(lane.pills||[]).map((p,pi)=>{
      const startYMD=dateToYMD(p.startDate);
      const endYMD=dateToYMD(p.endDate);
      let si=-1,ei=-1;
      if(startYMD)cols.forEach((c,ci)=>{if(c.year===startYMD.y&&c.month===startYMD.m)si=ci;});
      if(endYMD)cols.forEach((c,ci)=>{if(c.year===endYMD.y&&c.month===endYMD.m)ei=ci;});
      if(si===-1)si=Math.min(Math.max(p.col||0,0),nc-1);
      if(ei<si||ei===-1)ei=si;
      ei=Math.min(ei,nc-1);
      const span=ei-si+1;
      let startOffsetPct=0,totalWidthPct=100*span;
      if(startYMD){
        const daysInStartMonth=new Date(startYMD.y,startYMD.m+1,0).getDate();
        startOffsetPct=((startYMD.d-1)/daysInStartMonth)*100;
        if(endYMD){
          const daysInEndMonth=new Date(endYMD.y,endYMD.m+1,0).getDate();
          const endOffsetPct=(endYMD.d/daysInEndMonth)*100;
          totalWidthPct=100*(ei-si)+endOffsetPct-startOffsetPct;
        }
      }
      const startMs=p.startDate?new Date(p.startDate+'T00:00:00').getTime():si*2592000000;
      const endMs=p.endDate?new Date(p.endDate+'T00:00:00').getTime():startMs+2592000000;
      return{p,pi,si,ei,span,startOffsetPct,totalWidthPct,startMs,endMs};
    });

    assignRows(allPillsM);
    const maxRowM=allPillsM.reduce((m,x)=>Math.max(m,x.row||0),0);
    const rowHM=56;const cellHM=Math.max(64,(maxRowM+1)*rowHM+8);
    const cellItems=Array.from({length:nc},()=>[]);
    allPillsM.forEach(item=>cellItems[item.si].push(item));

    h+=`<div class="ll-cell ${par}" data-li="${li}" style="min-height:${cellHM}px">
      <div style="display:flex;flex-direction:column;flex:1;min-width:0">
        <span class="ll-name">${esc(lane.name)}</span>
      </div>
      <button onclick="openAddItemDialog(${li})" style="border:none;background:none;cursor:pointer;color:var(--mid)">+</button>
    </div>`;

    for(let ci=0;ci<nc;ci++){
      h+=`<div class="dc-cell ${par}" style="min-height:${cellHM}px;height:${cellHM}px" data-li="${li}" data-col="${ci}">`;
      cellItems[ci].forEach(({p,pi,startOffsetPct,totalWidthPct,span,row})=>{
        const r=row||0;
        const top=4+r*rowHM;
        const preciseStyle=`position:absolute;left:${startOffsetPct.toFixed(1)}%;width:${Math.max(totalWidthPct,2).toFixed(1)}%;top:${top}px;z-index:${p.zIndex||(3+r)}`;
        h+=pillHTML(p,CW*span-8,li,pi,undefined,undefined,preciseStyle);
      });
      h+=`</div>`;
    }
  });

  h+=`</div></div></div>`;
  document.getElementById('canvas').innerHTML=h;
}

function selectPill(li,pi){
  state.selectedPill={li,pi};
  renderCanvas();renderDetail();
}

function renderDetail(){
  const area=document.getElementById('detail-area');
  if(!state.selectedPill||!state.activeId){area.innerHTML='';return;}
  const rm=state.roadmaps[state.activeId];
  const{li,pi}=state.selectedPill;
  const p=rm.lanes?.[li]?.pills?.[pi];if(!p){area.innerHTML='';return;}

  const draft=_getDraft(li,pi)||p;
  const typesList=Array.isArray(draft.types)?draft.types:[draft.type||'dev'];

  let h=`<div class="detail-panel-wrap"><div class="detail-panel">
    <div class="detail-panel-hd">
      <h3>Editing: ${esc(draft.label)}</h3>
      <button class="btn btn-neutral btn-sm" onclick="_saveItem(${li},${pi})">💾 Save</button>
      <button class="btn btn-neutral btn-sm" onclick="state.selectedPill=null;renderCanvas();renderDetail()">Close</button>
    </div>
    <div class="detail-grid">
      <div class="detail-field"><div class="detail-field-lbl">Label</div><input class="detail-field-input" value="${esc(draft.label)}" oninput="_setDraftField(${li},${pi},'label',this.value)"></div>
      
      <!-- Multi-Type Checkboxes -->
      <div class="detail-field">
        <div class="detail-field-lbl">Stack Disciplines / Types</div>
        <div style="display:flex;flex-wrap:wrap;gap:6px;margin-top:4px">`;
  TYPES.forEach(ty=>{
    const checked=typesList.includes(ty.id)?'checked':'';
    h+=`<label style="display:inline-flex;align-items:center;gap:4px;font-size:11px;cursor:pointer;background:var(--offset);padding:3px 6px;border-radius:4px;border:1px solid var(--border)">
      <input type="checkbox" ${checked} onchange="_toggleDraftType(${li},${pi},'${ty.id}')">
      <span style="width:8px;height:8px;border-radius:50%;background:${ty.color}"></span>
      ${ty.label}
    </label>`;
  });
  h+=`</div></div>

      <div class="detail-field"><div class="detail-field-lbl">Start Date</div><input type="date" class="detail-field-input" value="${draft.startDate||''}" onchange="_setDraftField(${li},${pi},'startDate',this.value)"></div>
      <div class="detail-field"><div class="detail-field-lbl">End Date</div><input type="date" class="detail-field-input" value="${draft.endDate||''}" onchange="_setDraftField(${li},${pi},'endDate',this.value)"></div>
    </div>
  </div></div>`;
  area.innerHTML=h;
}

function addCol(){
  const list=getCols();
  if(state.view==='m'){
    const last=list[list.length-1]||{year:new Date().getFullYear(),month:new Date().getMonth()};
    const m=(last.month+1)%12, y=last.month===11?last.year+1:last.year;
    list.push({label:MONTHS[m]+' '+y,color:QC[m],year:y,month:m});
  } else {
    const last=list[list.length-1]||{label:'Q4 · 2026'};
    const q=parseInt(last.label.replace(/Q(\d).*/,'$1'))||4;
    const yMatch=last.label.match(/(\d{4})/);
    const y=yMatch?parseInt(yMatch[1]):2026;
    const nextQ=q===4?1:q+1, nextY=q===4?y+1:y;
    list.push({label:`Q${nextQ} · ${nextY}`,color:QC[nextQ-1]});
  }
  renderSidebar();renderCanvas();save();
}

function addLane(){
  const rm=state.roadmaps[state.activeId];if(!rm)return;
  rm.lanes.push({name:`Swimlane ${rm.lanes.length+1}`,pills:[]});
  save();renderSidebar();renderCanvas();
}

function delLane(li){
  state.roadmaps[state.activeId].lanes.splice(li,1);
  save();renderSidebar();renderCanvas();
}

function delPill(li,pi){
  state.roadmaps[state.activeId].lanes[li].pills.splice(pi,1);
  save();renderSidebar();renderCanvas();
}

function openAddItemDialog(li){
  const name=prompt('Item Name:');if(!name)return;
  const rm=state.roadmaps[state.activeId];
  rm.lanes[li].pills.push({label:name,type:'dev',types:['dev'],startDate:'',endDate:'',col:0,span:1,zIndex:3});
  save();renderSidebar();renderCanvas();
}

function showNewModal(){
  const n=prompt('Roadmap Name:');if(!n)return;
  const id=genId();
  state.roadmaps[id]=defRm(n);
  switchRoadmap(id);goToWorkspace();save();
}

function showExistingModal(){
  const keys=Object.keys(state.roadmaps);
  if(keys.length)switchRoadmap(keys[0]);
  goToWorkspace();
}

function goToHub(){
  document.getElementById('hub-page').style.display='flex';
  document.getElementById('workspace-bar').style.display='none';
  document.getElementById('workspace-layout').style.display='none';
}

function goToWorkspace(){
  document.getElementById('hub-page').style.display='none';
  document.getElementById('workspace-bar').style.display='flex';
  document.getElementById('workspace-layout').style.display='flex';
}

function toggleSidebar(){
  document.getElementById('sidebar').classList.toggle('hidden');
}

function authSignIn(){
  document.getElementById('auth-overlay').style.display='none';
  goToHub();
}

function authSignOut(){
  document.getElementById('auth-overlay').style.display='flex';
}

goToHub();
</script>
</body>
</html>
